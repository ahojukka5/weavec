name: apply-dead-code-fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/dead-native-code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply compiler and regression-test changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          driver_path = Path('runtime/build_driver.c')
          driver = driver_path.read_text(encoding='utf-8')

          marker = 'static void build_usage(void) {\n'
          helper = r'''static int llvm_definition_is_main(const char *line) {
              if (strncmp(line, "define ", 7) != 0) {
                  return 0;
              }
              const char *at = strchr(line, '@');
              if (at == NULL) {
                  return 0;
              }
              ++at;
              return strncmp(at, "main(", 5) == 0 ||
                     strncmp(at, "\"main\"(", 7) == 0;
          }

          static int internalize_build_module(const char *path) {
              FILE *input = fopen(path, "r");
              if (input == NULL) {
                  fprintf(stderr, "weavec: cannot read raw LLVM %s: %s\n", path, strerror(errno));
                  return 1;
              }

              char temporary[PATH_MAX];
              if (snprintf(temporary, sizeof(temporary), "%s.internal.XXXXXX", path) >=
                  (int)sizeof(temporary)) {
                  fprintf(stderr, "weavec: raw LLVM path is too long: %s\n", path);
                  fclose(input);
                  return 1;
              }
              int output_fd = mkstemp(temporary);
              if (output_fd < 0) {
                  fprintf(stderr, "weavec: cannot create internalized LLVM beside %s: %s\n",
                          path, strerror(errno));
                  fclose(input);
                  return 1;
              }
              FILE *output = fdopen(output_fd, "w");
              if (output == NULL) {
                  fprintf(stderr, "weavec: cannot open internalized LLVM stream: %s\n",
                          strerror(errno));
                  close(output_fd);
                  unlink(temporary);
                  fclose(input);
                  return 1;
              }

              char *line = NULL;
              size_t capacity = 0;
              int failed = 0;
              while (getline(&line, &capacity, input) >= 0) {
                  if (strncmp(line, "define ", 7) == 0 &&
                      !llvm_definition_is_main(line)) {
                      if (fputs("define internal ", output) == EOF ||
                          fputs(line + 7, output) == EOF) {
                          failed = 1;
                          break;
                      }
                  } else if (fputs(line, output) == EOF) {
                      failed = 1;
                      break;
                  }
              }
              if (ferror(input)) {
                  failed = 1;
              }
              free(line);
              if (fclose(input) != 0 || fclose(output) != 0) {
                  failed = 1;
              }
              if (failed) {
                  fprintf(stderr, "weavec: failed to internalize raw LLVM %s\n", path);
                  unlink(temporary);
                  return 1;
              }
              if (rename(temporary, path) != 0) {
                  fprintf(stderr, "weavec: cannot publish internalized LLVM %s: %s\n",
                          path, strerror(errno));
                  unlink(temporary);
                  return 1;
              }
              return 0;
          }

          static void build_usage(void) {
          '''
          assert marker in driver
          driver = driver.replace(marker, helper, 1)

          backend = '''    if (status != 0) {
                  FAIL_BUILD("backend", status);
              }
              if (publish_artifact(paths.raw_llvm, emit_llvm, "raw LLVM artifact") != 0) {
          '''
          internalized = '''    if (status != 0) {
                  FAIL_BUILD("backend", status);
              }
              if (internalize_build_module(paths.raw_llvm) != 0) {
                  FAIL_BUILD("backend", 1);
              }
              if (publish_artifact(paths.raw_llvm, emit_llvm, "raw LLVM artifact") != 0) {
          '''
          assert backend in driver
          driver = driver.replace(backend, internalized, 1)

          link = '''    char *link_args[] = {
                  (char *)linker,
                  paths.object,
                  runtime,
                  "-o",
                  output_template,
                  NULL,
              };
          '''
          stripped_link = '''    char *link_args[] = {
                  (char *)linker,
                  "-ffunction-sections",
                  "-fdata-sections",
                  paths.object,
                  runtime,
                  "-Wl,--gc-sections",
                  "-o",
                  output_template,
                  NULL,
              };
          '''
          assert link in driver
          driver = driver.replace(link, stripped_link, 1)
          driver_path.write_text(driver, encoding='utf-8')

          test_path = Path('test/optimization-evidence/test.sh')
          test = test_path.read_text(encoding='utf-8')
          old = '''grep -q '^; weave.source kind=function ' "$TMP/o3-native/fibonacci.raw.ll"
          grep -q '^define .*@fib' "$TMP/o3-native/fibonacci.optimized.ll"
          grep -Eq '^_?fib:' "$TMP/o3-native/fibonacci.s"
          grep -Eq '<_?fib>:' "$TMP/o3-native/fibonacci.disasm"
          grep -q '^# weavec optimization stage: llvm-ir' "$TMP/o3-native/fibonacci.opt.yaml"
          '''
          new = '''grep -q '^; weave.source kind=function ' "$TMP/o3-native/fibonacci.raw.ll"
          grep -q '^define internal .*@fib' "$TMP/o3-native/fibonacci.raw.ll"
          ! grep -q '^define .*@fib' "$TMP/o3-native/fibonacci.optimized.ll"
          ! grep -Eq '^_?fib:' "$TMP/o3-native/fibonacci.s"
          ! grep -Eq '<_?fib>:' "$TMP/o3-native/fibonacci.disasm"
          ! grep -Eq '<_?weave_rt_contract_fail>:' "$TMP/o3-native/fibonacci.disasm"
          grep -q '^# weavec optimization stage: llvm-ir' "$TMP/o3-native/fibonacci.opt.yaml"
          '''
          assert old in test
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/apply-dead-code-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/build_driver.c test/optimization-evidence/test.sh
          git rm --cached .github/workflows/apply-dead-code-fix.yml
          git commit -m "fix(codegen): remove unreachable native functions"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
