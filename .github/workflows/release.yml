# SPDX-License-Identifier: Apache-2.0
name: release

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  publish-patch:
    if: github.head_ref == 'agent/module-contract-symbols-work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/module-contract-symbols-work
          fetch-depth: 0

      - name: Build clean module contract branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git reset --hard origin/master

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/frontend/contract-lower.weave")
          text = path.read_text(encoding="utf-8")
          old = """      (call_void emit_node_text (param_get fd) (param_get source) (param_get tree)
                (call_i64 nth_child (param_get tree) (param_get fn_node) (const_i64 1)))"""
          new = """      (call_void surface_emit_symbol_name
                (param_get fd) (param_get source) (param_get tree)
                (call_i64 nth_child
                  (param_get tree) (param_get fn_node) (const_i64 1)))"""
          if text.count(old) != 1:
              raise SystemExit("contract declaration emission pattern changed")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend/contract-lower.weave
          git commit \
            -m "fix(modules): scope contract-lowered names" \
            -m "Route contract-bearing function declarations through the existing module symbol resolver so duplicate private names retain deterministic WIR identities."

          python3 - <<'PY'
          from pathlib import Path

          path = Path("test/module-symbols/test.sh")
          text = path.read_text(encoding="utf-8")
          old = """  (fn helper
            (params)
            (returns i32)
            (do (return (call_i32 offset))))"""
          new = """  (fn helper
            (params)
            (returns i32)
            (requires (const_bool true))
            (do (return (call_i32 offset))))"""
          if text.count(old) != 2:
              raise SystemExit("expected two duplicate private helper fixtures")
          text = text.replace(old, new)
          marker = """done
grep -Fq '(fn alpha-value ' "$TMP/module-symbols.wir""""
          replacement = """done
! grep -Fq '(fn helper ' "$TMP/module-symbols.wir"
grep -Fq '(fn alpha-value ' "$TMP/module-symbols.wir""""
          if text.count(marker) != 1:
              raise SystemExit("module symbol assertion marker changed")
          path.write_text(text.replace(marker, replacement), encoding="utf-8")
          PY

          git add test/module-symbols/test.sh
          git commit \
            -m "test(modules): cover contract name collisions" \
            -m "Make duplicate private helpers contract-bearing and ensure their raw source name does not appear in emitted WIR."

          git push origin HEAD:agent/module-contract-symbols-fix
