# SPDX-License-Identifier: Apache-2.0
name: apply-diagnostics-refactor

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply validated product patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/diagnostics.patch
          for part in .agent/diagnostics.patch.part*.b64; do
            base64 --decode "$part" >> /tmp/diagnostics.patch
          done
          if ! git apply --check --verbose /tmp/diagnostics.patch \
              > /tmp/diagnostics-apply.log 2>&1; then
            cat /tmp/diagnostics-apply.log
            exit 1
          fi
          git apply /tmp/diagnostics.patch
          rm -rf .agent .github/workflows/apply-diagnostics-patch.yml
          git config user.name "weavec automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor(diagnostics): use typed checked JSON"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload patch-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-patch-check-${{ github.sha }}
          path: |
            /tmp/diagnostics.patch
            /tmp/diagnostics-apply.log
          if-no-files-found: warn
          retention-days: 1
