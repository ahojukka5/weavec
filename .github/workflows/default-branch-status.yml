# SPDX-License-Identifier: Apache-2.0
name: default-branch-status

on:
  workflow_run:
    workflows: [ci, release]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    name: Publish push workflow status
    if: github.event.workflow_run.event == 'push'
    runs-on: self-hosted

    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail

          case "$CONCLUSION" in
            success)
              state=success
              ;;
            failure|timed_out|cancelled|action_required|startup_failure|stale)
              state=failure
              ;;
            *)
              state=error
              ;;
          esac

          case "$WORKFLOW" in
            ci)
              context=actions/ci-push
              description="CI push workflow: $CONCLUSION"
              ;;
            release)
              context=actions/release-push
              description="Release push workflow: $CONCLUSION"
              ;;
            *)
              echo "unexpected workflow: $WORKFLOW" >&2
              exit 1
              ;;
          esac

          payload=$(printf \
            '{"state":"%s","target_url":"%s","description":"%s","context":"%s"}' \
            "$state" "$RUN_URL" "$description" "$context")

          curl --fail-with-body --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA"
