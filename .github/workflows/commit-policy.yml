name: Commit policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push or pull-request update makes an in-flight run obsolete. Cancel
# it instead of letting it run to completion: these jobs land on a shared
# self-hosted fleet, so a superseded run is holding a slot that current work
# is queueing for. Grouped per workflow, so unrelated workflows in this
# repository never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "lint: validate commit messages"
    runs-on: self-hosted
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch pull request head
        run: git fetch --no-tags origin ${{ github.event.pull_request.head.sha }}

      - name: Validate pull request commits
        run: >-
          python3 scripts/check_commit_messages.py
          --range
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
