name: commit-policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Commit-message lint is a short Python scan. It used to share the
# self-hosted fleet with the full ladder, so a 12-second job sat in queue
# for minutes. GitHub-hosted runners start immediately and need no compiler
# toolchain.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "lint: validate commit messages"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch pull request head
        run: git fetch --no-tags origin ${{ github.event.pull_request.head.sha }}

      - name: Validate pull request commits
        run: >-
          python3 scripts/check_commit_messages.py
          --range
          ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
