name: publish-uniform-loop-lowering

on:
  push:
    branches:
      - tmp/publish-uniform-loop-lowering

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify patch
        run: |
          cat "$GITHUB_WORKSPACE/.github/transport/uniform-loop-lowering"/part-* > /tmp/patch.gz.b64
          base64 --decode /tmp/patch.gz.b64 > /tmp/patch.gz
          echo "f313512210df5f87f1e6fd9cd9592c3c0fe37b7a1a338d374022425254c24579  /tmp/patch.gz" | sha256sum --check -
          gzip -dc /tmp/patch.gz > /tmp/change.patch
          echo "66a51ea26b44e1913510eb7c8f4d88b9f354dfed2fb53666931f23e5e8752546  /tmp/change.patch" | sha256sum --check -

      - name: Apply product change
        run: |
          git fetch origin master
          git checkout --detach origin/master
          git apply --index /tmp/change.patch
          git diff --cached --check

      - name: Publish clean branch
        env:
          TARGET_BRANCH: refactor/uniform-loop-lowering
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(llvm): delegate loop SSA promotion to LLVM"
          git push --force origin "HEAD:refs/heads/$TARGET_BRANCH"
