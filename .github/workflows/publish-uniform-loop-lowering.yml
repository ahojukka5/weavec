name: publish-uniform-loop-lowering

on:
  push:
    branches:
      - tmp/publish-uniform-loop-lowering
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'tmp/publish-uniform-loop-lowering' || github.ref_name == 'tmp/publish-uniform-loop-lowering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify patch
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path('.github/transport/uniform-loop-lowering')
          diagnostics = []
          try:
              parts = sorted(root.glob('part-*'))
              transported = b''.join(path.read_bytes() for path in parts)
              diagnostics.append(f'parts={len(parts)}')
              diagnostics.append(f'part_sizes={[path.stat().st_size for path in parts]}')
              diagnostics.append(f'transported_base64_size={len(transported)}')
              diagnostics.append(f'transported_base64_sha256={hashlib.sha256(transported).hexdigest()}')

              # The contents API transport dropped the two characters "Ea" from
              # one chunk. Repair that transport-only omission before validating
              # the exact local artifact hashes.
              marker = b'vu5wdatZe'
              assert transported.count(marker) == 1
              joined = transported.replace(marker, b'vu5wEadatZe', 1)
              diagnostics.append(f'base64_size={len(joined)}')
              diagnostics.append(f'base64_sha256={hashlib.sha256(joined).hexdigest()}')
              assert hashlib.sha256(joined).hexdigest() == 'bb5aca5774c5997dfb7eb646620d928eba6e864cb1fe0b2a3902531be7a82303'

              compressed = base64.b64decode(joined, validate=True)
              Path('/tmp/patch.gz').write_bytes(compressed)
              diagnostics.append(f'gzip_size={len(compressed)}')
              diagnostics.append(f'gzip_sha256={hashlib.sha256(compressed).hexdigest()}')
              patch = gzip.decompress(compressed)
              Path('/tmp/change.patch').write_bytes(patch)
              diagnostics.append(f'patch_size={len(patch)}')
              diagnostics.append(f'patch_sha256={hashlib.sha256(patch).hexdigest()}')
              assert hashlib.sha256(compressed).hexdigest() == 'f313512210df5f87f1e6fd9cd9592c3c0fe37b7a1a338d374022425254c24579'
              assert hashlib.sha256(patch).hexdigest() == '66a51ea26b44e1913510eb7c8f4d88b9f354dfed2fb53666931f23e5e8752546'
          except Exception as exc:
              diagnostics.append(f'error={type(exc).__name__}: {exc}')
              raise
          finally:
              Path('/tmp/transport-diagnostics.txt').write_text('\n'.join(diagnostics) + '\n')
              print('\n'.join(diagnostics))
          PY

      - name: Upload transport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uniform-loop-lowering-transport-diagnostics
          path: /tmp/transport-diagnostics.txt
          if-no-files-found: error
          retention-days: 1

      - name: Apply product change
        run: |
          git fetch origin master
          git checkout --detach origin/master
          git apply --index /tmp/change.patch
          git diff --cached --check

      - name: Publish clean branch
        env:
          TARGET_BRANCH: refactor/uniform-loop-lowering
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(llvm): delegate loop SSA promotion to LLVM"
          git push --force origin "HEAD:refs/heads/$TARGET_BRANCH"
