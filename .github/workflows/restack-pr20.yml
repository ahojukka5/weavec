name: restack-pr20

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  restack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wir-v2-selfhost
          fetch-depth: 0

      - name: Rebuild PR branch on validated master
        shell: bash
        run: |
          set -euo pipefail
          if test "$(git rev-parse HEAD^)" = "2fb2a0837597884cdce4398ad272feb04e579d87"; then
            echo 'PR branch is already restacked'
            exit 0
          fi
          validated_tree="$(git rev-parse 'HEAD^{tree}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft 2fb2a0837597884cdce4398ad272feb04e579d87
          rebuilt_tree="$(git write-tree)"
          test "$rebuilt_tree" = "$validated_tree"
          git commit -m "refactor: migrate self-hosted compiler to WIR v2"
          git push --force origin HEAD:agent/wir-v2-selfhost
