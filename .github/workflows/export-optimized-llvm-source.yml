# SPDX-License-Identifier: Apache-2.0
name: export-optimized-llvm-source

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'feature/optimized-llvm-artifact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/optimized-llvm-artifact
      - name: Archive source tree
        shell: bash
        run: tar --exclude=.git -czf /tmp/weavec-optimized-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: weavec-optimized-source
          path: /tmp/weavec-optimized-source.tar.gz
          if-no-files-found: error
          retention-days: 1
