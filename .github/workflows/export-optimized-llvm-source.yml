# SPDX-License-Identifier: Apache-2.0
name: publish-native-evidence

on:
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: github.head_ref == 'feature/optimized-llvm-artifact'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: feature/optimized-llvm-artifact
          fetch-depth: 0

      - name: Recover and verify reviewed tree
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              os.environ['PR_URL'],
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              body = json.load(response).get('body') or ''
          begin = '<!-- NATIVE_EVIDENCE_PAYLOAD_BEGIN -->'
          end = '<!-- NATIVE_EVIDENCE_PAYLOAD_END -->'
          encoded = body.split(begin, 1)[1].split(end, 1)[0]
          encoded = ''.join(encoded.split())
          with open('/tmp/native-evidence.tar.xz', 'wb') as stream:
              stream.write(base64.b64decode(encoded, validate=True))
          PY
          printf '%s  %s\n' \
            '62c5c4e4145596ce4d600c87686571cc723570bc3b7cf4d09cdea3ce035247a9' \
            /tmp/native-evidence.tar.xz | sha256sum --check -

      - name: Publish reviewed commits
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git reset --hard origin/master
          tar -xJf /tmp/native-evidence.tar.xz
          chmod 0755 scripts/package-linux-release.sh \
            test-all.sh test/optimization-evidence/test.sh

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add runtime/llvm_toolchain.c runtime/build_driver.c \
            runtime/diagnostics_driver.c runtime/portable.c \
            runtime/source_locations.c
          git commit -F - <<'COMMIT'
          feat(llvm): add native evidence pipeline

          Add an explicit raw-to-optimized LLVM stage and generate assembly, object code,
          optimization remarks, and linked-executable disassembly under one profile.

          - Keep subprocess integration behind a replaceable semantic LLVM adapter.
          - Preserve raw LLVM while publishing each completed evidence phase atomically.
          COMMIT

          git add test/optimization-evidence test-all.sh \
            scripts/package-linux-release.sh .github/workflows/release.yml \
            scripts/analyze-performance-llvm.py \
            docs/llvm-codegen-analysis-report.md
          git commit -F - <<'COMMIT'
          test(llvm): validate native evidence artifacts

          Exercise O3 native Fibonacci evidence, optimizer and target-codegen failures,
          release packages, and extracted binaries across the complete build ladder.

          - Require optimized LLVM to simplify the raw structural form.
          - Verify assembly and disassembly from the linked executable on each platform.
          COMMIT

          git add README.md CHANGELOG.md docs/architecture.md \
            docs/build-manifest.md docs/command-reference.md \
            docs/diagnostics.md docs/index.md \
            docs/llvm-codegen-analysis.md docs/tooling-artifacts.md \
            docs/native-code-evidence.md
          git commit -F - <<'COMMIT'
          docs(llvm): define native evidence contract

          Document optimization profiles, CPU selection, artifact roles, publication,
          and the future in-process LLVM boundary.

          - Treat raw LLVM metrics as evidence rather than final-code defects.
          - Define evidence-first A/B evaluation for custom backend transformations.
          COMMIT

          python3 scripts/check_commit_messages.py --range origin/master..HEAD
          clang -std=c11 -Wall -Wextra -Werror -fsyntax-only runtime/portable.c
          bash -n test-all.sh test/optimization-evidence/test.sh \
            scripts/package-linux-release.sh
          git push --force origin HEAD:feature/optimized-llvm-evidence-clean
