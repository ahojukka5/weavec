name: polish-dead-code-fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/dead-native-code'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply portability and cleanup fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('runtime/build_driver.c')
          text = path.read_text(encoding='utf-8')

          marker = '''#ifndef WEAVEC_DEFAULT_LINKER
          #define WEAVEC_DEFAULT_LINKER "clang"
          #endif
          '''
          replacement = '''#ifndef WEAVEC_DEFAULT_LINKER
          #define WEAVEC_DEFAULT_LINKER "clang"
          #endif
          #if defined(__APPLE__)
          #define WEAVEC_LINK_DEAD_STRIP "-Wl,-dead_strip"
          #else
          #define WEAVEC_LINK_DEAD_STRIP "-Wl,--gc-sections"
          #endif
          '''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          old_close = '''    free(line);
              if (fclose(input) != 0 || fclose(output) != 0) {
                  failed = 1;
              }
          '''
          new_close = '''    free(line);
              int input_close_failed = fclose(input) != 0;
              int output_close_failed = fclose(output) != 0;
              if (input_close_failed || output_close_failed) {
                  failed = 1;
              }
          '''
          assert old_close in text
          text = text.replace(old_close, new_close, 1)
          assert '"-Wl,--gc-sections",' in text
          text = text.replace('        "-Wl,--gc-sections",\n',
                              '        WEAVEC_LINK_DEAD_STRIP,\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/polish-dead-code-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/build_driver.c
          git rm --cached .github/workflows/polish-dead-code-fix.yml
          git commit -m "fix(codegen): make dead stripping portable"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
