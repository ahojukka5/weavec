# SPDX-License-Identifier: Apache-2.0
name: runtime-source-export

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-sources-${{ github.sha }}
          path: |
            runtime/build_driver.c
            runtime/diagnostics_driver.c
            runtime/portable.c
            runtime/path_safety.c
            runtime/trace_runtime.c
          if-no-files-found: error
          retention-days: 1
