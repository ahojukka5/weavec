name: source-identity-hardening

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-locations
          fetch-depth: 0
      - name: Apply exact source identity hardening
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git log -1 --pretty=%s)" == "chore: apply source identity hardening" ]] || exit 0
          git apply <<'PATCH'
          diff --git a/src/core/extern.weave b/src/core/extern.weave
          --- a/src/core/extern.weave
          +++ b/src/core/extern.weave
          @@ -27,6 +27,7 @@
             (extern weave_rt_open_write_trunc (params (path ptr) (mode i32)) (returns i32))
             (extern weave_rt_contract_fail (params (msg ptr)) (returns void))
             (extern weave_rt_build_main (params (argc i32) (argv ptr)) (returns i32))
          +  (extern weave_rt_set_source_index (params (source_index i64)) (returns void))
             (extern weave_rt_emit_source_span
               (params (fd i32) (source ptr) (start i64) (len i64)) (returns void))
             (extern weave_rt_record_diagnostic_wir_span
          diff --git a/src/frontend/driver.weave b/src/frontend/driver.weave
          --- a/src/frontend/driver.weave
          +++ b/src/frontend/driver.weave
          @@ -85,6 +85,7 @@
                   (else (do)))
                 (call_i32 fchmod (local_get out_fd) (const_i32 420))
                 ; Run lowering pass
          +      (call_void weave_rt_set_source_index (const_i64 0))
                 (let status i32 (call_i32 lower_program
                   (local_get out_fd) (local_get source) (local_get tree)))
                 (call_i32 close (local_get out_fd))
          @@ -202,6 +203,8 @@
                   (condition (lt_i64 (local_get i) (cast_i32_to_i64 (param_get argc))))
                   (do
                     (let input_path ptr (load_ptr (ptr_add (param_get argv) (mul_i64 (local_get i) (const_i64 8)))))
          +          (call_void weave_rt_set_source_index
          +            (sub_i64 (local_get i) (param_get first_input_index)))
                     (let status i32 (call_i32 lower_source_file_pass
                       (local_get input_path) (local_get out_fd) (const_i32 0)))
                     (if
          @@ -217,6 +220,8 @@
                   (condition (lt_i64 (local_get i) (cast_i32_to_i64 (param_get argc))))
                   (do
                     (let input_path2 ptr (load_ptr (ptr_add (param_get argv) (mul_i64 (local_get i) (const_i64 8)))))
          +          (call_void weave_rt_set_source_index
          +            (sub_i64 (local_get i) (param_get first_input_index)))
                     (if
                       (condition (ne_i32 (call_i32 path_ends_with
                         (local_get input_path2) (const_string_ptr "main.weave") (const_i64 10)) (const_i32 0)))
          @@ -237,6 +242,8 @@
                   (condition (lt_i64 (local_get i) (cast_i32_to_i64 (param_get argc))))
                   (do
                     (let input_path3 ptr (load_ptr (ptr_add (param_get argv) (mul_i64 (local_get i) (const_i64 8)))))
          +          (call_void weave_rt_set_source_index
          +            (sub_i64 (local_get i) (param_get first_input_index)))
                     (if
                       (condition (eq_i32 (call_i32 path_ends_with
                         (local_get input_path3) (const_string_ptr "main.weave") (const_i64 10)) (const_i32 0)))
          diff --git a/test/diagnostics/test-build-diagnostics.sh b/test/diagnostics/test-build-diagnostics.sh
          --- a/test/diagnostics/test-build-diagnostics.sh
          +++ b/test/diagnostics/test-build-diagnostics.sh
          @@ -175,6 +175,34 @@ set -e
             exit 1
           }
           
          +cat > "$TMP/identical-a.weave" <<'EOF'
          +(program
          +  (name "diagnostics-identical")
          +  (version "0.1")
          +  (fn shared
          +    (params)
          +    (returns i32)
          +    (do (return (unknown_form 0)))))
          +EOF
          +cp "$TMP/identical-a.weave" "$TMP/identical-b.weave"
          +
          +set +e
          +"$WEAVEC" build "$TMP/identical-a.weave" "$TMP/identical-b.weave" \
          +  -o "$TMP/identical-inputs" \
          +  --diagnostics-json "$TMP/identical-inputs.diagnostics.json" \
          +  2>"$TMP/identical-inputs.stderr"
          +identical_inputs_exit="$?"
          +set -e
          +[[ "$identical_inputs_exit" -eq 11 ]] || {
          +  printf 'test-build-diagnostics: expected identical-input backend exit 11, got %s\n' \
          +    "$identical_inputs_exit" >&2
          +  exit 1
          +}
          +[[ ! -e "$TMP/identical-inputs" ]] || {
          +  printf 'test-build-diagnostics: identical-input failure published an executable\n' >&2
          +  exit 1
          +}
          +
           for stderr_file in "$TMP"/*.stderr; do
             if grep -q 'kept temporary build directory' "$stderr_file"; then
               printf 'test-build-diagnostics: internal temporary directory leaked to stderr: %s\n' \
          @@ -267,6 +295,18 @@ source = (root / "duplicate-main.weave").read_bytes()
           start = entry["span"]["start_byte"]
           end = entry["span"]["end_byte"]
           assert source[start:end] == b"unknown_form"
          +
          +identical = json.loads((root / "identical-inputs.diagnostics.json").read_text())
          +assert identical["phase"] == "backend"
          +assert identical["exit_code"] == 11
          +entry = identical["diagnostics"][0]
          +assert entry["code"] == "backend.unknown-expression-operator"
          +assert entry["span_origin"] == "propagated-wir-location"
          +assert pathlib.Path(entry["source"]) == root / "identical-a.weave"
          +source = (root / "identical-a.weave").read_bytes()
          +start = entry["span"]["start_byte"]
          +end = entry["span"]["end_byte"]
          +assert source[start:end] == b"unknown_form"
           PY
           
           printf 'test-build-diagnostics: passed\n'
          PATCH
          rm .github/workflows/source-export.yml
          python3 scripts/check_wir_core_version.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/extern.weave src/frontend/driver.weave test/diagnostics/test-build-diagnostics.sh .github/workflows/source-export.yml
          git commit -m "fix: preserve exact source identity"
          git push origin HEAD:agent/source-locations
