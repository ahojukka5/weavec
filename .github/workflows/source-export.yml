name: source-export

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source checkout
        run: tar --exclude=.git -czf /tmp/weavec-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: weavec-source
          path: /tmp/weavec-source.tar.gz
          if-no-files-found: error
          retention-days: 1
