name: apply-source-locations

on:
  pull_request:
    types: [opened, reopened]
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/source-locations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-locations
          fetch-depth: 0

      - name: Apply exact source-location implementation
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/apply_source_locations_patch.py.gz.b64 | gzip -d > /tmp/apply-source-locations.py
          set +e
          python3 /tmp/apply-source-locations.py > /tmp/source-location-patch.log 2>&1
          patch_status="$?"
          set -e
          if [[ "$patch_status" -ne 0 ]]; then
            cp /tmp/source-location-patch.log source-location-patch-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source-location-patch-error.log
            git commit -m "chore: capture source-location patch failure"
            git push origin HEAD:agent/source-locations
            exit "$patch_status"
          fi
          rm scripts/apply_source_locations_patch.py.gz.b64
          rm .github/workflows/apply-source-locations.yml
          rm -f source-location-patch-error.log
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: propagate exact source locations through WIR"
          git push origin HEAD:agent/source-locations
