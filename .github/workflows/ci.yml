# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  # BEGIN CANONICAL REFACTOR
  refactor:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/canonical-paths
          fetch-depth: 0

      - name: Apply canonical paths
        run: python3 scripts/refactor-canonical-paths.py

      - name: Validate transformed tree
        run: |
          bash -n build.sh
          bash -n selfhost.sh
          bash -n test.sh
          bash -n test-all.sh
          bash -n surface-matrix.sh
          bash -n scripts/patch-weavec-bootstrap-stack.sh
          bash -n scripts/weavec-bootstrap-has-stack-patch.sh
          bash -n scripts/test-weavec-bootstrap-stack.sh
          git diff --check
          ! git grep -n -e 'build/weavec2' -e 'WEAVEC2_BACKEND' -e 'WEAVEFRONT_' -- ':!CHANGELOG.md' ':!NOTICE'

      - name: Commit transformed tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: use canonical compiler and bootstrap paths"
          git push origin HEAD:refactor/canonical-paths
  # END CANONICAL REFACTOR

  test:
    if: github.event_name == 'push' || github.actor == 'github-actions[bot]'
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      WEAVEC0_TAG: v0.2.0
      WEAVEC1_TAG: v0.1.0
      WEAVEFRONT_TAG: v0.1.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Build compiler and run full ladder
        run: ./test-all.sh
