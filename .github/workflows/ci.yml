# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repository is public. The linux-*-sdks legs of `test` below (and
  # all of `deep-selfhost`) run on the self-hosted LUMI runner and must
  # never execute a fork's pull_request -- they need this job and fail
  # outright (not a silent skip) if the PR's head repository isn't this
  # same repository. macos-sdk runs on GitHub's own hosted runner
  # (ephemeral, isolated per run) so it's exempted below, not gated here.
  guard-self-hosted:
    name: Verify trusted source for self-hosted jobs
    runs-on: ubuntu-latest
    steps:
      - name: Reject pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Self-hosted LUMI runner jobs do not run for pull requests from forks (head repository: ${{ github.event.pull_request.head.repo.full_name }})."
          exit 1

  test:
    name: build & test (${{ matrix.name }})
    needs: guard-self-hosted
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-glibc-sdks
            os: self-hosted
            libc: glibc
          - name: linux-musl-sdks
            os: self-hosted
            libc: musl
          - name: macos-sdk
            os: macos-latest
            libc: glibc

    env:
      WEAVEC1_VERSION: v0.3.2
      WEAVEC1_LIBC: ${{ matrix.libc }}
      WEAVEC_BOOTSTRAP_VERSION: v0.3.1
      WEAVEC_BOOTSTRAP_LIBC: ${{ matrix.libc }}

    steps:
      - name: Reject self-hosted legs when the trust guard failed
        if: matrix.os == 'self-hosted' && needs.guard-self-hosted.result != 'success'
        run: |
          echo "::error::This self-hosted leg does not run for pull requests from forks."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify LLVM and SDK tools (Linux, preinstalled on this runner)
        if: runner.os == 'Linux'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version
          python3 --version

      - name: Build compiler and run full ladder
        shell: bash
        run: |
          set -o pipefail
          ./test-all.sh 2>&1 | tee ci.log

      - name: Verify dependency mode
        shell: bash
        run: |
          grep -F 'dependency mode: published SDKs' ci.log

      - name: Upload failed ladder log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ matrix.name }}-${{ github.run_id }}
          path: ci.log
          if-no-files-found: warn
          retention-days: 7

  deep-selfhost:
    name: deep self-host ladder
    needs: [test, guard-self-hosted]
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      WEAVEC1_VERSION: v0.3.2
      WEAVEC1_LIBC: glibc
      WEAVEC_BOOTSTRAP_VERSION: v0.3.1
      WEAVEC_BOOTSTRAP_LIBC: glibc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select self-host scratch storage
        shell: bash
        run: |
          set -euo pipefail
          best_dir=''
          best_kib=0
          for candidate in \
            "${TMPDIR:-}" \
            "${RUNNER_TEMP:-}" \
            /tmp \
            "$GITHUB_WORKSPACE"; do
            [[ -n "$candidate" && -d "$candidate" && -w "$candidate" ]] || continue
            available="$(df -Pk "$candidate" | awk 'NR == 2 { print $4 }')"
            [[ "$available" =~ ^[0-9]+$ ]] || continue
            if (( available > best_kib )); then
              best_dir="$candidate"
              best_kib="$available"
            fi
          done
          [[ -n "$best_dir" ]] || {
            echo '::error::No writable filesystem is available for self-host artifacts.'
            exit 1
          }
          scratch="$best_dir/weavec-selfhost-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$scratch" build
          mkdir -p "$scratch"
          ln -s "$scratch" build
          echo "WEAVEC_SELFHOST_SCRATCH=$scratch" >> "$GITHUB_ENV"
          printf 'Selected %s with %s KiB available.\n' "$best_dir" "$best_kib"
          df -h "$scratch"

      - name: Verify self-host toolchain (preinstalled on this runner)
        run: |
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Build seed compiler
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee selfhost-seed.log
          test -x build/weavec

      - name: Reclaim seed intermediates
        shell: bash
        run: |
          set -euo pipefail
          find "$WEAVEC_SELFHOST_SCRATCH" \
            -mindepth 1 -maxdepth 1 ! -name weavec \
            -exec rm -rf -- {} +
          test -x build/weavec
          df -h "$WEAVEC_SELFHOST_SCRATCH"

      - name: Run deep self-host
        shell: bash
        run: |
          set -o pipefail
          ./selfhost.sh 2>&1 | tee selfhost.log

      - name: Verify stage artifacts
        run: |
          test -x build/selfhost/stage1/weavec
          test -x build/selfhost/stage2/weavec

      - name: Run stage-2 project acceptance
        shell: bash
        run: |
          env WEAVEC="$GITHUB_WORKSPACE/build/selfhost/stage2/weavec" \
            WEAVEC_RUNTIME="$GITHUB_WORKSPACE/runtime/program.c" \
            bash test/project-acceptance/test.sh

      - name: Summarize failed self-host stage
        if: failure()
        shell: bash
        run: |
          find -L build/selfhost -maxdepth 3 -type f \
            -printf '%p %s bytes\n' 2>/dev/null | sort || true

      - name: Upload failed self-host evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-evidence-${{ github.run_id }}
          path: |
            selfhost-seed.log
            selfhost.log
            build/selfhost/stage1/weavec.wir
            build/selfhost/stage1/weavec.ll
            build/selfhost/**/*.backend.stdout
            build/selfhost/**/*.backend.stderr
            build/selfhost/**/*.failed
            build/selfhost/**/*.version.txt
            build/selfhost/**/*.smoke.wir
            build/selfhost/**/*.smoke.stdout
            build/selfhost/**/*.smoke.stderr
          if-no-files-found: warn
          retention-days: 7

      - name: Clean self-host scratch storage
        if: always()
        shell: bash
        run: |
          rm -rf "${WEAVEC_SELFHOST_SCRATCH:-}"
          rm -f build
