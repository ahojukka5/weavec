# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      WEAVEC0_TAG: v0.2.1
      WEAVEC1_TAG: v0.2.0
      WEAVEC_BOOTSTRAP_REF: 6ea7319f88afa32121cff7fa7cd76e79703fff30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang git llvm
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Build compiler and run full ladder
        run: ./test-all.sh
