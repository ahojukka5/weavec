# SPDX-License-Identifier: Apache-2.0
#
# Continuous integration for weavec2.
#
# Builds weavec2 from source and runs the full test ladder on Linux and macOS
# using the platform's stable LLVM toolchain. test-all.sh invokes build.sh,
# which fetches the validated source pins below into build/vendor/.
#
# The full ladder covered here:
#   - 124 correctness tests (.weave fixtures and WIR end-to-end cases)
#   - 168 performance tests (.wir fixtures with .expected.ll goldens)
#   -   4 quantum validation tests
#   -   1 quantum e2e test (links runtime/quantum_runtime.c)
#   -   1 basic self-host test (weavec2 recompiles build/weavec2.wir)
#
# ./selfhost.sh also passes, but it is intentionally local-only because it
# rebuilds the large compiler through multiple generations. It is no longer
# blocked by the historical string-constant issue described in older changelog
# entries.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    env:
      # Pin the source releases that the complete bootstrap has been validated
      # against. Unlike weavec1 and weavefront Linux builds, weavec2 still needs
      # source-produced weavefront parser modules that are not in a published SDK.
      WEAVEC0_TAG: v0.2.0
      WEAVEC1_TAG: v0.1.0
      WEAVEFRONT_TAG: v0.1.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang
          echo "Tool versions:"
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Build all dependencies + weavec2, run full ladder
        run: ./test-all.sh
