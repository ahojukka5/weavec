# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-glibc-sdks
            os: [self-hosted, linux, x64, lumi, lumi-cpu, lumi-small]
            libc: glibc
          - name: linux-musl-sdks
            os: [self-hosted, linux, x64, lumi, lumi-cpu, lumi-small]
            libc: musl
          - name: macos-sdk
            os: macos-latest
            libc: glibc

    env:
      WEAVEC1_VERSION: v0.3.2
      WEAVEC1_LIBC: ${{ matrix.libc }}
      WEAVEC_BOOTSTRAP_VERSION: v0.3.1
      WEAVEC_BOOTSTRAP_LIBC: ${{ matrix.libc }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM and SDK tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl git llvm python3
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version
          python3 --version

      - name: Build compiler and run full ladder
        shell: bash
        run: |
          set -o pipefail
          ./test-all.sh 2>&1 | tee ci.log

      - name: Verify dependency mode
        shell: bash
        run: |
          grep -F 'dependency mode: published SDKs' ci.log

      - name: Upload failed ladder log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ matrix.name }}-${{ github.run_id }}
          path: ci.log
          if-no-files-found: warn
          retention-days: 7

  deep-selfhost:
    name: deep self-host ladder
    needs: test
    runs-on: [self-hosted, linux, x64, lumi, lumi-cpu, lumi-small]
    timeout-minutes: 45
    env:
      WEAVEC1_VERSION: v0.3.2
      WEAVEC1_LIBC: glibc
      WEAVEC_BOOTSTRAP_VERSION: v0.3.1
      WEAVEC_BOOTSTRAP_LIBC: glibc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install self-host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl git llvm python3
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Build seed compiler
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee selfhost-seed.log
          test -x build/weavec

      - name: Run deep self-host
        shell: bash
        run: |
          set -o pipefail
          ./selfhost.sh 2>&1 | tee selfhost.log

      - name: Verify stage artifacts
        run: |
          test -x build/selfhost/stage1/weavec
          test -x build/selfhost/stage2/weavec

      - name: Upload failed self-host evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-evidence-${{ github.run_id }}
          path: |
            selfhost-seed.log
            selfhost.log
            build/selfhost/**/*.failed
            build/selfhost/**/*.version.txt
            build/selfhost/**/*.smoke.wir
            build/selfhost/**/*.smoke.stdout
            build/selfhost/**/*.smoke.stderr
          if-no-files-found: warn
          retention-days: 7
