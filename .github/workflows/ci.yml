# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-paths
          fetch-depth: 0
      - run: python3 scripts/refactor-uppercase-stage-name.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: remove remaining WEAVEC2 symbols"
          git push origin HEAD:refactor/canonical-paths

  test:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: echo cleanup committed
