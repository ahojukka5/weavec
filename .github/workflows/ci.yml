# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-glibc-sdks
            os: ubuntu-latest
            libc: glibc
          - name: linux-musl-sdks
            os: ubuntu-latest
            libc: musl
          - name: macos-source-fallback
            os: macos-latest
            libc: glibc

    env:
      WEAVEC0_TAG: v0.2.1
      WEAVEC1_VERSION: v0.2.0
      WEAVEC1_TAG: v0.2.0
      WEAVEC1_LIBC: ${{ matrix.libc }}
      WEAVEC_BOOTSTRAP_VERSION: v0.2.0
      WEAVEC_BOOTSTRAP_REF: v0.2.0
      WEAVEC_BOOTSTRAP_LIBC: ${{ matrix.libc }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM and SDK tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl git llvm python3
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version
          python3 --version

      - name: Build compiler and run full ladder
        run: |
          set -o pipefail
          ./test-all.sh 2>&1 | tee ci.log

      - name: Verify dependency mode
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            grep -F "dependency modes: weavec1=sdk bootstrap=sdk" ci.log
          else
            grep -F "dependency modes: weavec1=source bootstrap=source" ci.log
          fi

      - name: Upload failed ladder log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-${{ matrix.name }}
          path: ci.log
          if-no-files-found: ignore
          retention-days: 7
